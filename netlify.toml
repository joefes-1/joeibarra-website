# Netlify build settings.
# The site is plain HTML (published from the repo root). The one build step refreshes the
# private client-page directory used by /admin (scripts/build-directory.mjs) and the link-preview
# tags on client pages (scripts/build-previews.mjs).
[build]
  publish = "."
  command = "node scripts/build-previews.mjs && node scripts/build-directory.mjs"

# Tour calendar files ("Add to my calendar" on tour pages): open in Calendar instead of as text
[[headers]]
  for = "/homes/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Content-Disposition = "inline; filename=home-tour.ics"
