<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Client pages · Joseph Ibarra</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#3F5266">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Lato:wght@400;700&display=swap">
<link rel="stylesheet" href="/homes/homes.css">
<style>
/* Private dashboard for Joseph: client reactions + client page directory. Data comes from /api/admin (password-locked). */
.admin{padding-block:clamp(28px,5vw,48px) clamp(40px,6vw,72px)}
.admin .wrap{display:flex;flex-direction:column;gap:28px}
.admin h1{font-size:clamp(34px,5.5vw,48px)}
.admin h2{font-size:clamp(26px,4vw,32px)}
.head-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head-row .btn{min-height:40px;padding:0 16px;font-size:13.5px}
.panel{display:flex;flex-direction:column;gap:14px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.count{font-size:14px;color:var(--muted)}
.muted{color:var(--muted)}

/* Tabs */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-top:-8px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font:700 15px var(--sans);color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--slate)}
.tab-body{display:flex;flex-direction:column;gap:28px}
/* Leads */
.lead-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.lead-filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.lead-filters select,.lead-filters input{font:inherit;font-size:15px;color:var(--ink);background:#fff;border:1.5px solid #CFC8BA;border-radius:10px;padding:0 10px;min-height:42px;min-width:0}
.leads{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.lead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lead-name{font-weight:700;color:var(--ink);text-decoration:none;font-size:16px}
.lead-name:hover{text-decoration:underline}
.lead-meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-top:3px}
.lead-meta .pill{font-size:10px;padding:2px 8px}
.lead .btn{min-height:36px;padding:0 12px;font-size:13px;white-space:nowrap}
.lead .req{font-size:13px;font-weight:700;color:var(--green-deep, #24603D);display:flex;gap:8px;align-items:center}
.lead .req button{background:none;border:0;padding:0;font:700 13px var(--sans);color:var(--muted);text-decoration:underline;cursor:pointer}
.leads-more{align-self:center}
@media (max-width:640px){.lead{grid-template-columns:1fr}}

/* Login */
.login{display:flex;flex-direction:column;gap:14px;max-width:420px}
.login label{font-size:13px;font-weight:700;color:var(--ink)}
.login .field{display:flex;gap:8px}
.login input{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid #CFC8BA;border-radius:10px;padding:0 14px;min-height:48px}
.login input:focus{outline:none;border-color:var(--slate);box-shadow:0 0 0 3px var(--slate-tint)}
.msg{font-size:14px;font-weight:700;color:#8A3B2B}

/* Reactions feed */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.rx{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}
.rx.is-new{border-color:#8CC7A3;box-shadow:0 0 0 3px #EEF7F1}
.rx img,.rx .ph{width:72px;height:56px;border-radius:9px;object-fit:cover;background:var(--cream)}
.rx-top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.rx-what{font-weight:700;color:var(--ink);font-size:15px}
.rx-when{font-size:12.5px;color:var(--muted)}
.rx-new{display:inline-flex;background:var(--green-tint);color:var(--green-deep);border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.rx-home{font-size:14px;color:var(--body);line-height:1.35}
.rx-link{text-decoration:none}
/* The whole reaction card opens the client's page; the Seen button sits above the link */
.rx-link::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1}
.rx-link:focus-visible{outline:none}
.rx:has(.rx-link):hover,.rx:has(.rx-link:focus-visible){border-color:var(--slate);box-shadow:0 6px 18px rgba(31,42,55,.08)}
.rx:has(.rx-link:focus-visible){box-shadow:0 0 0 3px var(--slate-tint)}
.rx-note{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--body);margin-top:4px;line-height:1.35}
.rx{position:relative;transition:opacity .25s,transform .25s}
.rx-top{padding-right:58px}
.rx-hide{position:absolute;z-index:2;top:8px;right:8px;background:var(--cream);border:0;border-radius:999px;padding:5px 11px;font:700 12px var(--sans);color:var(--muted);cursor:pointer}
.rx-hide:hover,.rx-hide:focus-visible{background:var(--slate-tint);color:var(--slate-deep)}
.rx-hide:disabled{opacity:.6;cursor:default}
.rx.leaving{opacity:0;transform:translateX(12px)}
.hide-all{margin-left:10px;background:none;border:0;padding:0;font:700 13px var(--sans);color:var(--slate);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.hidden-rx .feed{margin-top:12px}
.hidden-rx .rx{opacity:.75}
@media (prefers-reduced-motion:reduce){.rx{transition:none}}

/* Page directory */
.pages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.pages{grid-template-columns:1fr}}
.pg{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,box-shadow .2s,transform .2s}
/* The whole card opens the client page: the name link stretches over the card, buttons sit above it */
.pg-link{color:inherit;text-decoration:none}
.pg-link::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1}
.pg-link:focus-visible{outline:none}
.pg:has(.pg-link):hover,.pg:has(.pg-link:focus-visible){border-color:var(--slate);box-shadow:0 6px 18px rgba(31,42,55,.08);transform:translateY(-1px)}
.pg:has(.pg-link:focus-visible){box-shadow:0 0 0 3px var(--slate-tint)}
.pg .actions,.pg .remove{position:relative;z-index:2}
@media (prefers-reduced-motion:reduce){.pg{transition:none}.pg:hover{transform:none!important}}
.pg-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pg-name{font-family:var(--serif);font-size:24px;color:var(--ink);line-height:1.1}
.pill{display:inline-flex;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:var(--slate-tint);color:var(--slate-deep)}
.pill.tour{background:#FFF4D6;color:#6E5100}
.pg-line{font-size:14px;color:var(--body)}
.pg-exp{font-size:13px;color:var(--muted)}
.pg-exp.soon{color:#8A3B2B;font-weight:700}
.pg-counts{display:flex;gap:12px;font-size:14px;color:var(--ink)}
.pg .actions{margin-top:4px}
.pg .actions .btn{min-height:38px;padding:0 14px;font-size:13px}
.expired summary{cursor:pointer;font-weight:700;color:var(--slate);font-size:15px}
.expired .pages{margin-top:12px}
.expired .pg{opacity:.75}
.pg .remove{align-self:flex-start;background:none;border:0;padding:4px 0 0;font:700 13px var(--sans);color:#8A3B2B;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.pg .remove:disabled{opacity:.6;cursor:default}
.removed .pg{opacity:.85}
.empty-box{background:var(--cream);border-radius:14px;padding:16px;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="brand" href="/">Joseph Ibarra<small>Client pages · private</small></a>
  <button class="btn btn-ghost" id="signout" type="button" hidden>Sign out</button></div></header>

<main class="admin"><div class="wrap" id="view">
  <noscript><p>This page needs JavaScript.</p></noscript>
</div></main>

<script>
(function(){
  'use strict';
  var KEY = 'joeibarra-admin-key', SEEN = 'joeibarra-admin-seen';
  var view = document.getElementById('view'), signout = document.getElementById('signout');
  var current = null;   // password for this visit (also saved in the browser when allowed)
  var REACTION = {love:{icon:'❤️', text:function(c){ return c + ' loved it'; }},
                  pass:{icon:'👎', text:function(c){ return 'Not for ' + c; }}};

  // Browser storage can be blocked (private mode); the page still works, you'd just re-enter the password.
  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function set(k, v){ try{ v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); }catch(e){} }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeUrl(u){ return /^(https?:\/\/|\/)/i.test(String(u || '')) ? String(u) : ''; }
  function today(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function day(ymd, opts){ return new Date(ymd.slice(0, 10) + 'T12:00:00').toLocaleDateString('en-US', opts || {month:'short', day:'numeric'}); }
  function daysUntil(ymd){ return Math.round((new Date(ymd + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 864e5); }
  function ago(iso){
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if(s < 60) return 'just now';
    if(s < 3600) return Math.floor(s / 60) + 'm ago';
    if(s < 86400) return Math.floor(s / 3600) + 'h ago';
    if(s < 7 * 86400) return Math.floor(s / 86400) + 'd ago';
    return new Date(iso).toLocaleDateString('en-US', {month:'short', day:'numeric'});
  }
  function money(n){ return typeof n === 'number' ? '$' + n.toLocaleString('en-US') : esc(n); }

  /* ---------- Login ---------- */
  function showLogin(message){
    signout.hidden = true;
    view.innerHTML =
      '<div><div class="eyebrow">Private</div><h1>Your client pages</h1></div>' +
      '<form class="login" id="login"><label for="pw">Password</label>' +
      '<div class="field"><input id="pw" type="password" autocomplete="current-password" required><button class="btn btn-solid" type="submit">Unlock</button></div>' +
      (message ? '<p class="msg">' + esc(message) + '</p>' : '') + '</form>';
    document.getElementById('login').addEventListener('submit', function(e){
      e.preventDefault();
      var pw = document.getElementById('pw').value;
      set(KEY, pw); load(pw, true);
    });
    document.getElementById('pw').focus();
  }

  /* ---------- Data ---------- */
  function load(pw, fromLogin){
    if(!pw){ showLogin(); return; }
    current = pw;
    fetch('/api/admin', {headers:{Authorization:'Bearer ' + pw}, cache:'no-store'})
      .then(function(res){
        if(res.status === 401){ set(KEY, null); showLogin(fromLogin ? 'That password didn’t work.' : ''); return null; }
        if(res.status === 429){ showLogin('Too many tries. Wait a minute and try again.'); return null; }
        if(res.status === 503){ showLogin('Almost there: the admin password still needs to be added in Netlify (ADMIN_PASSWORD).'); return null; }
        if(!res.ok) throw new Error(res.status);
        return res.json();
      })
      .then(function(data){ if(data) render(data); })
      .catch(function(){ showLogin('Couldn’t load right now. Check your connection and try again.'); });
  }

  /* ---------- Dashboard ---------- */
  function render(data){
    signout.hidden = false;
    var pages = data.pages || [], reactions = data.reactions || {}, removedAt = data.removed || {}, now = today();
    // Same rule as the client page: a removal counts unless the page was updated after it.
    function isRemoved(p){
      var r = removedAt[p.page]; if(!r || !r.at) return false;
      return r.at.slice(0, 16) >= [p.created || '', p.date || '', p.lastAdded || ''].sort().pop();
    }
    var byPage = {}; pages.forEach(function(p){ if(!isRemoved(p)) byPage[p.page] = p; });
    var lastSeen = get(SEEN) || '';

    // Flatten reactions into one feed (skips test pages that aren't real client pages)
    var feed = [];
    Object.keys(reactions).forEach(function(pageId){
      var p = byPage[pageId]; if(!p) return;
      Object.keys(reactions[pageId]).forEach(function(homeId){
        var v = reactions[pageId][homeId] || {};
        var home = (p.listings || []).filter(function(h){ return h.id === homeId; })[0] || {address:'A home no longer on the page'};
        feed.push({page:p, homeId:homeId, home:home, r:v.r, note:v.note, at:v.at || ''});
      });
    });
    feed.sort(function(a, b){ return a.at < b.at ? 1 : -1; });
    // Reactions you hid stay hidden until the client changes them (new `at`)
    var hiddenAt = data.hidden || {};
    function isHidden(f){ var h = hiddenAt[f.page.page]; return !!(h && h[f.homeId] != null && h[f.homeId] >= f.at); }
    var shown = feed.filter(function(f){ return !isHidden(f); }), hidden = feed.filter(isHidden);

    var counts = {};
    feed.forEach(function(f){ var c = counts[f.page.page] = counts[f.page.page] || {love:0, pass:0, note:0, last:''};
      if(f.r === 'love') c.love++; if(f.r === 'pass') c.pass++; if(f.note) c.note++; if(f.at > c.last) c.last = f.at; });

    var active = [], expired = [], removed = [];
    pages.forEach(function(p){ (isRemoved(p) ? removed : p.expires && now >= p.expires ? expired : active).push(p); });
    function activity(p){ var c = counts[p.page] || {}; return [c.last || '', p.lastAdded || '', p.created || '', p.date || ''].sort().pop(); }
    active.sort(function(a, b){ return activity(a) < activity(b) ? 1 : -1; });
    expired.sort(function(a, b){ return (a.expires || '') < (b.expires || '') ? 1 : -1; });
    var fresh = shown.filter(function(f){ return lastSeen && f.at > lastSeen; }).length;

    view.innerHTML =
      '<div class="head-row"><div><div class="eyebrow">Private</div><h1>Your client pages</h1></div>' +
        '<button class="btn btn-soft" id="refresh" type="button">Refresh</button></div>' +
      '<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="pages">Client pages</button>' +
        '<button type="button" role="tab" data-tab="leads">Contacts</button></nav>' +
      '<div class="tab-body" data-body="pages">' +

      '<section class="panel"><div class="panel-head"><h2>Client reactions</h2><span class="count">' +
        (shown.length ? shown.length + (shown.length === 1 ? ' reaction' : ' reactions') + (fresh ? ' · ' + fresh + ' new' : '') : '') +
        (shown.length > 1 ? '<button class="hide-all" type="button">Mark all seen</button>' : '') + '</span></div>' +
        (shown.length ? '<ul class="feed">' + shown.map(function(f){ return feedItem(f, lastSeen, false); }).join('') + '</ul>'
          : '<div class="empty-box">' + (feed.length ? 'You’re all caught up. New reactions will show up here.'
                                                     : 'No reactions yet. When a client taps ❤️ or 👎 or leaves a note, it shows up here.') + '</div>') +
        (hidden.length ? '<details class="expired hidden-rx"><summary>Old reactions (' + hidden.length + ')</summary><ul class="feed">' +
          hidden.map(function(f){ return feedItem(f, '', true); }).join('') + '</ul></details>' : '') +
      '</section>' +

      '<section class="panel"><div class="panel-head"><h2>Active client pages</h2><span class="count">' + active.length + '</span></div>' +
        (active.length ? '<div class="pages">' + active.map(function(p){ return pageCard(p, counts[p.page]); }).join('') + '</div>'
                       : '<div class="empty-box">No active client pages right now.</div>') +
      '</section>' +

      (expired.length ? '<details class="expired"><summary>Expired pages (' + expired.length + ')</summary><div class="pages">' +
        expired.map(function(p){ return pageCard(p, counts[p.page]); }).join('') + '</div></details>' : '') +
      (removed.length ? '<details class="expired removed"><summary>Removed pages (' + removed.length + ')</summary><div class="pages">' +
        removed.map(function(p){ return pageCard(p, null, removedAt[p.page].at); }).join('') + '</div></details>' : '') +
      '<section class="panel"><div class="panel-head"><h2>Claude &amp; Follow Up Boss</h2></div>' +
        '<p class="muted">Claude signs in to your Follow Up Boss connection with this password. If a device is lost or you just want to cut it off, disconnect it here; Claude will ask for the password again next time.</p>' +
        '<div><button class="btn btn-soft" id="disconnect-claude" type="button">Disconnect Claude</button></div></section>' +
      '</div>' +
      '<div class="tab-body" data-body="leads" hidden>' + leadsShell() + '</div>';
    pagesBySlug = {}; pages.forEach(function(p){ if(!isRemoved(p)) pagesBySlug[p.page] = p; });
    leadsLoaded = false;
    showTab(get(TAB) || 'pages');

    set(SEEN, new Date().toISOString());   // everything on screen now counts as seen next time
    document.getElementById('refresh').addEventListener('click', function(){ load(current); });
  }

  /* ---------- Tabs ---------- */
  var TAB = 'joeibarra-admin-tab', pagesBySlug = {}, leadsLoaded = false;
  function showTab(name){
    if(name !== 'leads') name = 'pages';
    document.querySelectorAll('.tabs [data-tab]').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.tab === name ? 'true' : 'false'); });
    document.querySelectorAll('.tab-body').forEach(function(d){ d.hidden = d.dataset.body !== name; });
    set(TAB, name);
    if(name === 'leads' && !leadsLoaded){ leadsLoaded = true; loadLeads(false); }
  }
  document.addEventListener('click', function(e){ var t = e.target.closest('.tabs [data-tab]'); if(t) showTab(t.dataset.tab); });

  /* ---------- Leads (Follow Up Boss) ---------- */
  var leadState = {cursor:null, requested:[], stages:null, sources:{}, byId:{}, seq:0};
  function slug(name){ return String(name || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); }
  function sel(id, label, opts){
    return '<label>' + label + '<select id="' + id + '">' + opts.map(function(o){ return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('') + '</select></label>';
  }
  function leadsShell(){
    return '<section class="panel"><div class="panel-head"><h2>Contacts</h2><span class="count" id="leads-count"></span></div>' +
      '<p class="muted">Your Follow Up Boss contacts. Nothing goes on your site unless you hit <strong>Make client page</strong>, then tell Claude to build your requested pages.</p>' +
      '<div class="lead-filters">' +
        '<label>Name<input id="lf-q" type="search" placeholder="Search name"></label>' +
        sel('lf-stage', 'Stage', [['', 'All stages']]) +
        sel('lf-source', 'Source', [['', 'All sources']]) +
        sel('lf-created', 'Added', [['', 'Any time'], ['1', 'Today'], ['7', 'Last 7 days'], ['30', 'Last 30 days'], ['90', 'Last 90 days'], ['365', 'Last year']]) +
        sel('lf-activity', 'Active', [['', 'Any time'], ['1', 'Last 24 hours'], ['7', 'Last 7 days'], ['30', 'Last 30 days'], ['90', 'Last 90 days']]) +
        sel('lf-sort', 'Sort', [['created', 'Newest added'], ['lastActivity', 'Recent activity']]) +
      '</div><ul class="leads" id="leads"></ul><p class="muted" id="leads-msg"></p>' +
      '<button class="btn btn-soft leads-more" id="leads-more" type="button" hidden>Load more</button></section>';
  }
  function leadRow(l){
    var page = pagesBySlug[slug(l.name)], requested = leadState.requested.indexOf(l.id) > -1;
    var action = page ? '<a class="btn btn-soft" href="' + esc(page.path) + '">Open client page</a>'
      : requested ? '<span class="req">✓ Page requested <button type="button" class="lead-undo" data-id="' + l.id + '">Undo</button></span>'
      : '<button class="btn btn-solid lead-make" type="button" data-id="' + l.id + '" data-name="' + esc(l.name) + '">Make client page</button>';
    return '<li class="lead" data-lead="' + l.id + '"><div><a class="lead-name" href="https://app.followupboss.com/2/people/view/' + l.id + '">' + esc(l.name || 'No name') + '</a>' +
      '<div class="lead-meta">' + (l.stage ? '<span class="pill">' + esc(l.stage) + '</span>' : '') + (l.source ? '<span>' + esc(l.source) + '</span>' : '') +
      (l.created ? '<span>Added ' + esc(new Date(l.created).toLocaleDateString('en-US', {month:'short', day:'numeric', year: new Date(l.created).getFullYear() === new Date().getFullYear() ? undefined : 'numeric'})) + '</span>' : '') +
      (l.lastActivity ? '<span>Active ' + esc(ago(l.lastActivity)) + '</span>' : '') + '</div></div>' + action + '</li>';
  }
  function leadQuery(more){
    var q = new URLSearchParams();
    [['q','lf-q'],['stage','lf-stage'],['source','lf-source'],['createdDays','lf-created'],['activityDays','lf-activity'],['sort','lf-sort']].forEach(function(p){
      var v = document.getElementById(p[1]).value; if(v) q.set(p[0], v); });
    q.set('limit', '50');
    if(more && leadState.cursor != null) q.set('cursor', leadState.cursor);
    return q.toString();
  }
  function loadLeads(more){
    var list = document.getElementById('leads'), msg = document.getElementById('leads-msg'), btn = document.getElementById('leads-more');
    if(!list) return;
    if(!more){ list.innerHTML = ''; leadState.cursor = null; }
    msg.textContent = 'Loading…'; btn.hidden = true;
    var seq = ++leadState.seq;              // only the newest request may draw (typing + filters can overlap)
    fetch('/api/admin/leads?' + leadQuery(more), {headers:{Authorization:'Bearer ' + current}, cache:'no-store'})
      .then(function(res){ return res.json().then(function(d){ if(!res.ok) throw new Error(d.error || res.status); return d; }); })
      .then(function(d){
        if(seq !== leadState.seq) return;
        d.leads = (d.leads || []).filter(function(l){ return !list.querySelector('[data-lead="' + l.id + '"]'); });   // never show a contact twice
        leadState.requested = d.requested || leadState.requested;
        if(d.stages && !leadState.stages){
          leadState.stages = d.stages;
          var s = document.getElementById('lf-stage');
          d.stages.forEach(function(n){ var o = document.createElement('option'); o.value = o.textContent = n; s.appendChild(o); });
        }
        var src = document.getElementById('lf-source');
        (d.leads || []).forEach(function(l){ if(l.source && !leadState.sources[l.source]){ leadState.sources[l.source] = 1; var o = document.createElement('option'); o.value = o.textContent = l.source; src.appendChild(o); } });
        (d.leads || []).forEach(function(l){ leadState.byId[l.id] = l; });
        list.insertAdjacentHTML('beforeend', (d.leads || []).map(leadRow).join(''));
        leadState.cursor = d.nextCursor;
        if(d.total != null) document.getElementById('leads-count').textContent = d.total + (d.total === 1 ? ' contact' : ' contacts');
        msg.textContent = list.children.length ? '' : 'No contacts match these filters.';
        btn.hidden = d.nextCursor == null;
      })
      .catch(function(err){ if(seq !== leadState.seq) return; msg.textContent = /FUB_API_KEY/.test(err.message) ? 'Follow Up Boss isn’t connected yet (FUB_API_KEY in Netlify).' : 'Couldn’t load contacts: ' + err.message; });
  }
  var leadTimer;
  document.addEventListener('change', function(e){ if(e.target.closest('.lead-filters') && e.target.id !== 'lf-q') loadLeads(false); });
  document.addEventListener('input', function(e){ if(e.target.id === 'lf-q'){ clearTimeout(leadTimer); leadTimer = setTimeout(function(){ loadLeads(false); }, 400); } });
  document.addEventListener('click', function(e){
    if(e.target.closest('#leads-more')) return loadLeads(true);
    var b = e.target.closest('.lead-make, .lead-undo'); if(!b) return;
    var make = b.classList.contains('lead-make'), id = +b.dataset.id;
    b.disabled = true;
    fetch('/api/admin/leads', {method:'POST', cache:'no-store', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + current},
      body: JSON.stringify({action: make ? 'request-page' : 'cancel-request', personId:id, name:b.dataset.name || ''})})
      .then(function(res){
        if(!res.ok) throw new Error(res.status);
        if(make) leadState.requested.push(id); else leadState.requested = leadState.requested.filter(function(x){ return x !== id; });
        b.closest('.lead').outerHTML = leadRow(leadState.byId[id]);
      })
      .catch(function(){ b.disabled = false; alert('That didn’t go through. Try again.'); });
  });

  function feedItem(f, lastSeen, isHiddenItem){
    var who = f.page.client || 'Client', rx = REACTION[f.r];
    var what = rx ? rx.icon + ' ' + rx.text(who) : '📝 ' + who + ' left a note';
    var photo = safeUrl(f.home.photo);
    var isNew = lastSeen && f.at > lastSeen;
    var btn = '<button class="rx-hide" type="button" data-action="' + (isHiddenItem ? 'unhide' : 'hide') + '" aria-label="' +
      (isHiddenItem ? 'Move this reaction back to the feed' : 'Mark this reaction as seen') + '">' + (isHiddenItem ? 'Move back' : 'Seen') + '</button>';
    return '<li class="rx' + (isNew ? ' is-new' : '') + '" data-page="' + esc(f.page.page) + '" data-home="' + esc(f.homeId) + '" data-at="' + esc(f.at) + '">' + btn +
      (photo ? '<img src="' + esc(photo) + '" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'ph\'}))">' : '<div class="ph"></div>') +
      '<div><div class="rx-top"><a class="rx-what rx-link" href="' + esc(f.page.path + '#h-' + f.homeId) + '" aria-label="' + esc(what + ' – open ' + who + '\u2019s page') + '">' + esc(what) + '</a>' + (isNew ? '<span class="rx-new">New</span>' : '') +
        '<span class="rx-when">' + (f.at ? esc(ago(f.at)) : '') + '</span></div>' +
      '<div class="rx-home">' + esc(f.home.address) + (f.home.price != null ? ' · ' + money(f.home.price) : '') + '</div>' +
      (f.note ? '<p class="rx-note">“' + esc(f.note) + '”</p>' : '') +
      '</div></li>';
  }

  function pageCard(p, c, removedOn){
    c = c || {love:0, pass:0, note:0};
    var tour = p.mode === 'tour', n = (p.listings || []).length;
    var line = tour
      ? (p.date ? 'Tour ' + day(p.date, {weekday:'short', month:'short', day:'numeric'}) + ' · ' : '') + n + (n === 1 ? ' stop' : ' stops')
      : n + (n === 1 ? ' home' : ' homes') + (p.created ? ' · sent ' + day(p.created) : '') + (p.lastAdded ? ' · last added ' + day(p.lastAdded) : '');
    var exp = '';
    if(p.expires){
      var left = daysUntil(p.expires);
      var lastDay = new Date(p.expires + 'T12:00:00'); lastDay.setDate(lastDay.getDate() - 1);   // shuts off at midnight starting `expires`
      lastDay = lastDay.toLocaleDateString('en-US', {month:'short', day:'numeric'});
      exp = left <= 0 ? 'Expired ' + day(p.expires)
          : 'Live through ' + lastDay + ' (' + left + (left === 1 ? ' day' : ' days') + ' left)';
      exp = '<span class="pg-exp' + (left > 0 && left <= 3 ? ' soon' : '') + '">' + esc(exp) + '</span>';
    }
    var link = 'joeibarra.com' + p.path;
    var who = esc(p.client || p.page) + '\u2019s ' + (tour ? 'tour' : 'homes') + ' page';
    if(removedOn){
      return '<article class="pg"><div class="pg-top"><span class="pg-name">' + esc(p.client || p.page) + '</span>' +
        '<span class="pill' + (tour ? ' tour' : '') + '">' + (tour ? 'Tour' : 'Homes') + '</span></div>' +
        '<span class="pg-line">' + esc(line) + '</span><span class="pg-exp">Removed ' + esc(new Date(removedOn).toLocaleDateString('en-US', {month:'short', day:'numeric'})) + '</span>' +
        '<div class="actions"><button class="btn btn-soft page-action" type="button" data-action="restore" data-page="' + esc(p.page) + '" data-who="' + who + '">Restore</button></div></article>';
    }
    return '<article class="pg"><div class="pg-top"><a class="pg-name pg-link" href="' + esc(p.path) + '">' + esc(p.client || p.page) + '</a>' +
      '<span class="pill' + (tour ? ' tour' : '') + '">' + (tour ? 'Tour' : 'Homes') + '</span></div>' +
      '<span class="pg-line">' + esc(line) + '</span>' + exp +
      (tour ? '' : '<div class="pg-counts"><span>❤️ ' + c.love + '</span><span>👎 ' + c.pass + '</span><span>📝 ' + c.note + '</span></div>') +
      '<div class="actions"><button class="btn btn-soft copy" type="button" data-link="' + esc(link) + '">Copy link</button></div>' +
      '<button class="remove page-action" type="button" data-action="remove" data-page="' + esc(p.page) + '" data-who="' + who + '">Remove page</button></article>';
  }

  // Copy a client's link (no ".html") to paste into a text
  document.addEventListener('click', function(e){
    var b = e.target.closest('.copy'); if(!b) return;
    var done = function(){ var t = b.textContent; b.textContent = 'Copied!'; setTimeout(function(){ b.textContent = t; }, 1500); };
    if(navigator.clipboard) navigator.clipboard.writeText(b.dataset.link).then(done, function(){ prompt('Copy this link:', b.dataset.link); });
    else prompt('Copy this link:', b.dataset.link);
  });
  // Remove (takes the client's link offline) / Restore
  document.addEventListener('click', function(e){
    var b = e.target.closest('.page-action'); if(!b) return;
    var remove = b.dataset.action === 'remove';
    if(remove && !confirm('Remove ' + b.dataset.who + '?\n\nThe link will stop working for them right away. You can restore it later from "Removed pages".')) return;
    b.disabled = true; b.textContent = remove ? 'Removing\u2026' : 'Restoring\u2026';
    fetch('/api/admin', {method:'POST', cache:'no-store',
      headers:{'Content-Type':'application/json', Authorization:'Bearer ' + current},
      body: JSON.stringify({action:b.dataset.action, page:b.dataset.page})})
      .then(function(res){ if(!res.ok) throw new Error(res.status); load(current); })
      .catch(function(){ b.disabled = false; b.textContent = remove ? 'Remove page' : 'Restore'; alert('That didn\u2019t go through. Try again.'); });
  });
  // Mark a reaction Seen (moves it to Old reactions), Mark all seen, or Move back. Saved on the site, so it holds on your phone too.
  document.addEventListener('click', function(e){
    var one = e.target.closest('.rx-hide'), all = e.target.closest('.hide-all');
    if(!one && !all) return;
    var rows = one ? [one.closest('.rx')] : [].slice.call(document.querySelectorAll('.panel > .feed .rx'));
    var action = one ? one.dataset.action : 'hide';
    var items = rows.map(function(li){ return {page:li.dataset.page, home:li.dataset.home, at:li.dataset.at}; });
    var btn = one || all; btn.disabled = true;
    rows.forEach(function(li){ li.classList.add('leaving'); });
    fetch('/api/admin', {method:'POST', cache:'no-store',
      headers:{'Content-Type':'application/json', Authorization:'Bearer ' + current},
      body: JSON.stringify({action:action, items:items})})
      .then(function(res){ if(!res.ok) throw new Error(res.status); setTimeout(function(){ load(current); }, 200); })
      .catch(function(){ btn.disabled = false; rows.forEach(function(li){ li.classList.remove('leaving'); }); alert('That didn’t go through. Try again.'); });
  });
  document.addEventListener('click', function(e){
    var b = e.target.closest('#disconnect-claude'); if(!b) return;
    if(!confirm('Disconnect Claude from your Follow Up Boss? It will need your password to connect again.')) return;
    b.disabled = true;
    fetch('/api/admin', {method:'POST', cache:'no-store', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + current},
      body: JSON.stringify({action:'disconnect-claude'})})
      .then(function(res){ b.textContent = res.ok ? 'Disconnected' : 'Didn\u2019t work, try again'; if(!res.ok) b.disabled = false; })
      .catch(function(){ b.disabled = false; b.textContent = 'Didn\u2019t work, try again'; });
  });
  signout.addEventListener('click', function(){ set(KEY, null); current = null; showLogin(); });

  load(get(KEY));
})();
</script>
</body>
</html>
